<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nathanaël</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout : un écran = une activité. Gros blocs « jouets en plastique » posés sur un ciel avec une colline. */
:root{
  --sky:#BFE6FF; --sky-deep:#8ECFFF; --hill:#86D66A; --hill-deep:#4FAE3B;
  --ink:#1E2A4A; --muted:#5A6788; --paper:#FFFFFF; --line:#E1E9F3;
  --sun:#FFC83D; --sun-deep:#E39E00; --soft-shadow:rgba(30,42,74,.18);
  --display:'Fredoka', ui-rounded, 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body:ui-rounded, -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  --r-xl:32px;
}
html,body{height:100%}
body{
  margin:0; overflow:hidden; color:var(--ink); font-family:var(--display);
  background-color:var(--sky);
  background-image:
    radial-gradient(140% 38% at 30% 114%, var(--hill) 0 58%, transparent 59%),
    radial-gradient(120% 34% at 85% 112%, var(--hill-deep) 0 50%, transparent 51%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
#app{height:100%;position:relative}
.screen{height:100%;display:flex;flex-direction:column}
.bar{
  flex:none;display:flex;align-items:center;gap:12px;padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.scroll{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.spacer{flex:1}

/* Bouton « jouet » : bloc épais qui s'enfonce sous le doigt */
.toy{
  --c:var(--paper); --d:#B8C8DC;
  border:0;cursor:pointer;background:var(--c);border-radius:var(--r-xl);
  box-shadow:0 8px 0 var(--d), 0 14px 22px var(--soft-shadow);
  transition:transform .08s ease, box-shadow .08s ease;
}
.toy:active{transform:translateY(6px);box-shadow:0 2px 0 var(--d), 0 5px 10px var(--soft-shadow)}
.toy:focus-visible{outline:5px solid var(--ink);outline-offset:4px}

.mascot{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #fff;box-sizing:border-box;box-shadow:0 5px 0 rgba(0,0,0,.15);pointer-events:none}

/* ---------- Accueil de démarrage ---------- */
#splash{align-items:center;justify-content:center;gap:22px;text-align:center;padding-inline:16px}
#splash .big-mascot{width:min(48vw,220px);aspect-ratio:1;animation:bob 2.4s ease-in-out infinite}
#splash h1{margin:0;font-size:clamp(40px,9vw,72px);font-weight:700;letter-spacing:.01em;color:var(--ink);text-wrap:balance}
#splash p{margin:0;font-family:var(--body);color:var(--muted);font-size:15px}
.startbtn{width:150px;height:150px;border-radius:50%;--c:var(--hill);--d:var(--hill-deep);display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
.startbtn svg{width:64px;height:64px;margin-left:10px}

/* ---------- Menu ---------- */
.homemascot{width:64px;height:64px;border:0;background:none;padding:0;cursor:pointer}
.brand{font-size:26px;font-weight:700}
.lock{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;padding:0}
.lock .ring{position:relative;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:22px}
.lock svg{position:absolute;inset:0;transform:rotate(-90deg)}
.lock circle{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-dasharray:151;stroke-dashoffset:151}
.lock.holding circle{transition:stroke-dashoffset 2.5s linear;stroke-dashoffset:0}
.lock small{font-family:var(--body);font-size:10px;color:var(--muted);letter-spacing:.04em}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(40vw,180px),1fr));gap:24px;max-width:1040px;margin:0 auto}
.tile{aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden;container-type:inline-size}
.tile::before{content:"";position:absolute;width:76%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.28)}
.tile .ic{position:relative;font-size:84px;font-size:52cqi;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12))}
.tile .txt{position:relative;font-weight:700;font-size:40px;font-size:30cqi;line-height:1;color:var(--paper);text-shadow:0 4px 0 rgba(0,0,0,.18);letter-spacing:.02em}

/* ---------- Écran catégorie ---------- */
.homebtn{width:76px;height:76px;border-radius:50%;--c:var(--sun);--d:var(--sun-deep);font-size:38px;display:grid;place-items:center;flex:none}
.modes{flex:1;display:flex;justify-content:center;gap:14px}
.mode{height:72px;min-width:84px;padding-inline:18px;border-radius:999px;font-size:36px;display:flex;align-items:center;justify-content:center;gap:8px}
.mode small{font-size:16px;font-weight:600}
.mode.on{--c:var(--sun);--d:var(--sun-deep)}
.catbadge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.15)}
@media (max-width:480px){.mode small{display:none}.mode{min-width:72px;padding-inline:12px}.catbadge{display:none}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(40vw,170px),1fr));gap:22px;max-width:1120px;margin:0 auto}
.card{aspect-ratio:1;display:grid;place-items:center;padding:6%;position:relative;container-type:inline-size;--d:var(--catd,#B8C8DC)}
.emo{font-size:96px;font-size:62cqi;line-height:1;display:block}
.svgemo{width:74cqi;height:74cqi}
.svgemo svg,.shape svg{width:100%;height:100%;display:block}
.blob{width:120px;height:120px;width:76cqi;height:76cqi;border-radius:58% 42% 55% 45%/50% 55% 45% 50%;background:var(--c);position:relative;
  box-shadow:0 6px 14px rgba(0,0,0,.14)}
.blob.white{box-shadow:inset 0 0 0 5px #D3DDEA, 0 6px 14px rgba(0,0,0,.08)}
.blob .mini{position:absolute;right:-6%;bottom:-6%;font-size:28cqi;line-height:1}
.shape{width:80cqi;height:80cqi}
.num{display:flex;flex-direction:column;align-items:center;gap:3cqi;width:100%}
.digit{font-size:38cqi;line-height:.9;font-weight:700}
.dots{display:flex;flex-wrap:wrap;justify-content:center;max-width:90cqi}
.dots span{width:17cqi;font-size:13cqi;line-height:1.25;text-align:center;transition:transform .15s ease}
.dots span.lit{transform:scale(1.6)}
.num.only .dots{max-width:98cqi}
.num.only .dots span{width:19cqi;font-size:16cqi}
.num.few .dots span{width:30cqi;font-size:26cqi}
.digitonly{font-size:66cqi;line-height:1;font-weight:700}
.wordv{display:flex;flex-direction:column;align-items:center;gap:3cqi}
.wordv .emo{font-size:46cqi}
.word{font-size:20cqi;font-weight:700;line-height:1;letter-spacing:.05em;white-space:nowrap}
body.caps .word{text-transform:uppercase}

/* ---------- Mode Jouer ---------- */
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(16px,4vh,34px);padding-block:6px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.ask{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.askbtn{display:flex;align-items:center;gap:6px;height:92px;padding:8px 24px 8px 8px;border-radius:999px;font-size:40px}
.askbtn .m{width:76px;height:76px}
.askbtn.happy .m{animation:jump .6s ease}
.stars{display:flex;gap:4px;font-size:34px;background:rgba(255,255,255,.55);padding:8px 14px;border-radius:999px}
.stars span{transition:transform .3s ease, filter .3s ease}
.stars .off{filter:grayscale(1);opacity:.28}
.stars .pop{animation:boing .6s ease}
.choices{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(12px,3vw,30px);
  width:100%;max-width:calc(var(--n) * 270px);
  width:min(100%, calc(var(--n) * 270px), calc(var(--n) * (100dvh - 270px)))}
.choices .card{transition:opacity .3s ease, transform .3s ease}
.card.fade{opacity:.3;transform:scale(.9)}
.card.done{--c:#E4F8D9;--d:#86D66A;cursor:default}
.card.done:active{transform:none;box-shadow:0 8px 0 var(--d), 0 14px 22px var(--soft-shadow)}

/* ---------- Animations ---------- */
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.13) rotate(-3deg)}60%{transform:scale(.95) rotate(2deg)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(6px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.16) rotate(-4deg)}70%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1.1)}}
@keyframes hint{0%,100%{box-shadow:0 8px 0 var(--d), 0 14px 22px var(--soft-shadow)}50%{box-shadow:0 8px 0 var(--d), 0 0 0 12px rgba(255,200,61,.9)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) scale(1.08)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes stkIn{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.boing{animation:boing .5s ease}
.wiggle{animation:wiggle .5s ease}
.win{animation:win .7s ease forwards}
.hint{animation:hint 1.1s ease-in-out infinite}

/* ---------- Album ---------- */
.albumhead{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:700;background:rgba(255,255,255,.6);padding:8px 18px;border-radius:999px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(26vw,128px),1fr));gap:18px;max-width:1000px;margin:0 auto}
.slot{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;container-type:inline-size;padding:0}
.slot .emo{font-size:58cqi}
.slot.locked{--c:rgba(255,255,255,.45);--d:rgba(30,42,74,.12)}
.slot.locked .emo{filter:grayscale(1) brightness(1.6);opacity:.35}

/* ---------- Superpositions ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  padding-top:max(16px, env(safe-area-inset-top, 0px));padding-bottom:max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#sticker{background:rgba(30,42,74,.6);overflow:hidden}
#sticker .burst{position:absolute;width:min(110vw,640px);aspect-ratio:1;border-radius:50%;
  background:repeating-conic-gradient(var(--sun) 0 12deg, #FFE59A 12deg 24deg);animation:spin 14s linear infinite;
  -webkit-mask:radial-gradient(circle, #000 35%, transparent 70%);mask:radial-gradient(circle, #000 35%, transparent 70%)}
#sticker .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px}
#sticker .stk{font-size:min(46vw,230px);line-height:1;animation:stkIn .8s cubic-bezier(.2,1.5,.4,1);filter:drop-shadow(0 10px 0 rgba(0,0,0,.18))}
.okbtn{width:116px;height:116px;border-radius:50%;--c:var(--hill);--d:var(--hill-deep);display:grid;place-items:center}
.okbtn svg{width:58px;height:58px}

#parents{background:rgba(30,42,74,.55);z-index:60}
.sheet{background:var(--paper);color:var(--ink);border-radius:24px;width:100%;max-width:720px;max-height:100%;overflow-y:auto;
  padding:22px clamp(16px,4vw,30px) 28px;font-family:var(--body);font-size:16px;line-height:1.45;-webkit-user-select:text;user-select:text;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{font-family:var(--display);font-size:28px;margin:0;text-wrap:balance}
.sheet h3{font-family:var(--display);font-size:19px;margin:26px 0 6px;text-wrap:balance}
.sheet .top{display:flex;align-items:center;gap:12px}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{background:#F1F6FC;border-radius:999px;padding:6px 14px;font-size:15px;font-variant-numeric:tabular-nums}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.prow .pic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.prow b{font-family:var(--display);font-weight:600;font-size:17px}
.prow .meta{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;border-radius:4px}
.setrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.setrow label{font-weight:600}
.seg{display:inline-flex;background:#F1F6FC;border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:var(--body);font-weight:600}
.seg button.on{background:var(--ink);color:var(--paper)}
.switch{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:999px;background:#CBD6E4;position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--paper);box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--hill-deep)}
.switch:checked::after{transform:translateX(22px)}
.switch:focus-visible,.pbtn:focus-visible,.seg button:focus-visible,select:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
.pbtn{border:0;border-radius:12px;padding:10px 16px;font-family:var(--body);font-weight:600;cursor:pointer;background:#F1F6FC;color:var(--ink)}
.pbtn.dark{background:var(--ink);color:var(--paper)}
.pbtn.danger{background:#FDECEC;color:#B3261E}
.pbtn.danger.armed{background:#B3261E;color:var(--paper)}
.sheet select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);max-width:100%;background:var(--paper);color:var(--ink)}
.sheet input[type=range]{width:160px;accent-color:var(--ink)}
.note{color:var(--muted);font-size:14px}
.closebtn{width:44px;height:44px;border-radius:50%;border:0;background:#F1F6FC;font-size:22px;cursor:pointer;color:var(--ink)}

.photo{width:100%;height:100%;object-fit:cover;border-radius:20%;display:block;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.wordv .photo{width:46cqi;height:46cqi}
.slot .photo{width:58%;height:auto;aspect-ratio:1}
.recthumb{width:38px;height:38px;border-radius:8px;object-fit:cover}
.recbtns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.recrow{padding-block:8px}
/* ---------- Mon prénom ---------- */
.namewrap{display:flex;flex-direction:column;align-items:center;gap:28px;max-width:900px;margin:0 auto;padding-top:20px}
.namerow{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.nl{width:min(17vw,96px);aspect-ratio:1;border-radius:24px;font:700 min(10vw,56px)/1 var(--display);display:grid;place-items:center;padding:0}
.nl.lit{transform:scale(1.22)}
.sayname{padding:16px 34px;font-size:34px;font-weight:700;color:var(--ink)}
.choices.namegame{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,5vh,40px);width:100%;max-width:none}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.slot2{width:min(9.5vw,56px);aspect-ratio:.8;border-bottom:5px solid var(--ink);background:rgba(255,255,255,.6);border-radius:10px 10px 0 0;display:grid;place-items:center;font:700 min(7vw,40px)/1 var(--display)}
.slot2.cur{background:#FFF2B8;animation:pulse 1.2s ease-in-out infinite}
.nopts{display:flex;gap:clamp(12px,3vw,28px)}
.nopt{width:min(26vw,150px);aspect-ratio:1;font:700 min(16vw,90px)/1 var(--display);display:grid;place-items:center;padding:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="app">
  <section id="splash" class="screen">
    <div class="big-mascot" id="splashMascot"></div>
    <h1>Nathanaël</h1>
    <button class="toy startbtn" id="startBtn" aria-label="Commencer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 5 3.5z" fill="#FFFFFF"/></svg>
    </button>
    <p>Jeux d’éveil pour les petits de 3 ans · Montez le son 🔊</p>
  </section>

  <section id="home" class="screen" hidden>
    <header class="bar">
      <button class="homemascot" id="homeMascot" aria-label="Nathanaël"></button>
      <span class="brand">Nathanaël</span>
      <span class="spacer"></span>
      <button class="lock" id="lockBtn" aria-label="Espace parents : appui long">
        <span class="ring"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/></svg>🔒</span>
        <small>Parents · appui long</small>
      </button>
    </header>
    <div class="scroll"><div class="tiles" id="tiles"></div></div>
  </section>

  <section id="cat" class="screen" hidden>
    <header class="bar">
      <button class="toy homebtn" data-home aria-label="Menu principal">🏠</button>
      <div class="modes">
        <button class="toy mode" data-mode="discover" aria-label="Découvrir">👆<small>Découvrir</small></button>
        <button class="toy mode" data-mode="play" aria-label="Jouer">🎲<small>Jouer</small></button>
        <button class="toy mode" data-mode="memory" aria-label="Mémoire">🧠<small>Mémoire</small></button>
      </div>
      <div class="catbadge" id="catBadge"></div>
    </header>
    <div class="scroll" id="discover"><div class="cards" id="cards"></div></div>
    <div class="play" id="play" hidden>
      <div class="ask">
        <button class="toy askbtn" id="askBtn" aria-label="Répéter la question"><span class="m" id="askMascot"></span>🔊</button>
        <div class="stars" id="stars" aria-label="Étoiles"></div>
      </div>
      <div class="choices" id="choices"></div>
    </div>
    <div class="play" id="memory" hidden><div class="cards" id="mgrid" style="width:100%;max-width:560px"></div></div>
  </section>

  <section id="album" class="screen" hidden>
    <header class="bar">
      <button class="toy homebtn" data-home aria-label="Menu principal">🏠</button>
      <span class="spacer"></span>
      <div class="albumhead" id="albumHead"></div>
      <span class="spacer"></span>
    </header>
    <div class="scroll"><div class="album" id="albumGrid"></div></div>
  </section>
</div>

<div id="sticker" class="overlay" hidden>
  <div class="burst"></div>
  <div class="inner">
    <div class="stk" id="stkEmo"></div>
    <button class="toy okbtn" id="stkOk" aria-label="Continuer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<div id="parents" class="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-label="Espace parents"></div>
</div>

<div id="pause" class="overlay" hidden style="background:rgba(30,42,74,.92);color:#fff;text-align:center;font-size:34px;z-index:70"><div>😴<br>C’est l’heure de la pause !<br><small style="font-size:16px;font-family:var(--body)">Parents : maintenez l’écran 3 secondes pour reprendre</small></div></div>
<canvas id="fx"></canvas>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const rand = n => Math.floor(Math.random()*n);

function starPoints(cx, cy, R, r){
  const p = [];
  for (let i=0;i<10;i++){
    const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r : R;
    p.push((cx + rr*Math.cos(a)).toFixed(1) + ',' + (cy + rr*Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
}
function shapeSVG(item){
  const f = `fill="${item.c}" stroke="${item.d}" stroke-width="5" stroke-linejoin="round"`;

}

/* ---------- Voix ---------- */
const synth = window.speechSynthesis || null;
let frVoices = [], voice = null, speakToken = 0, clip = null;
const urls = {}, recs = {};
const keep = [];
function voiceScore(v){
  const n = v.name || '', l = (v.lang || '').toLowerCase().replace('_','-');
  let s = 0;
  if (/natural|neural|online|naturelle/i.test(n)) s += 8;
  if (/premium|enhanced|améliorée|ameliorée|siri/i.test(n)) s += 6;
  if (/google/i.test(n)) s += 4;
  if (/amélie|amelie|audrey|denise|vivienne|eloise|élodie|marie|julie|léa|lea|charline|brigitte|céline|celine/i.test(n)) s += 3;
  if (/compact|espeak|robot/i.test(n)) s -= 6;
  if (l === 'fr-fr') s += 2;
  if (!v.localService) s += 1;
  return s;
}
function loadVoices(){
  if (!synth) return;
  const all = synth.getVoices() || [];
  frVoices = all.filter(v => v.lang && v.lang.toLowerCase().replace('_','-').startsWith('fr'));
  const isFR = v => /fr[-_]fr/i.test(v.lang);
  frVoices.sort((a, b) => voiceScore(b) - voiceScore(a));
  voice = frVoices.find(v => v.voiceURI === S.voiceURI) || frVoices[0] || null;
}
if (synth){ loadVoices(); try { synth.addEventListener('voiceschanged', loadVoices); } catch(e) { synth.onvoiceschanged = loadVoices; } }

function onlineTTS(text, fin){
  try {
    const a = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=fr&q=' + encodeURIComponent(text));
    clip = a; a.onended = fin; a.onerror = fin; a.play().catch(fin);
    return true;
  } catch(e){ return false; }
}
function speakOne(text, cb, key){
  let done = false, timer = 0, started = false, online = false;
  const fin = () => { if (done) return; done = true; clearTimeout(timer); cb && cb(); };
  if (key && recs[key] && playRec(key, fin)) return;
  const est = 900 + text.length * 95 / S.rate;
  const goOnline = () => { online = true; clearTimeout(timer); timer = setTimeout(fin, est + 6000); if (!onlineTTS(text, fin)){ clearTimeout(timer); timer = setTimeout(fin, est); } };
  if (!synth || !frVoices.length){ goOnline(); return; }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; if (voice) u.voice = voice;
    u.rate = S.rate; u.pitch = 1; u.volume = 1;
    u.onstart = () => { started = true; };
    u.onend = () => { if (!online) fin(); }; u.onerror = () => { if (!online) fin(); };
    keep.push(u); if (keep.length > 30) keep.shift();
    synth.speak(u);
    timer = setTimeout(fin, est + 2500);
    const tk = speakToken;
    setTimeout(() => { if (!started && !done && tk === speakToken){ try { synth.cancel(); } catch(e) {} goOnline(); } }, 1500);
  } catch(e){ goOnline(); }
}
function stopVoice(){ speakToken++; try { synth && synth.cancel(); } catch(e) {} if (clip){ try { clip.pause(); } catch(e) {} clip = null; } }
function say(text, cb, key){
  stopVoice(); const tok = speakToken;
  speakOne(text, () => { if (tok === speakToken && cb) cb(); }, key);
}
/* Suite : [texte, clé d'enregistrement] | fonction | pause en ms */
function seq(parts, cb){
  stopVoice(); const tok = speakToken; let i = 0;
  const next = () => {
    if (tok !== speakToken) return;
    if (i >= parts.length){ cb && cb(); return; }
    const q = parts[i++];
    if (typeof q === 'function'){ q(); next(); }
    else if (typeof q === 'number') setTimeout(next, q);
    else speakOne(q[0], next, q[1]);
  };
  next();
}
function sayChain(list, onStep, cb){
  stopVoice(); const tok = speakToken; let i = 0;
  const next = () => {
    if (tok !== speakToken) return;
    if (i >= list.length){ cb && cb(); return; }
    onStep && onStep(i);
    speakOne(list[i++], next);
  };
  next();
}

let db = null, recCur = null, recCat = 'couleurs', recMsg = '';
function openDB(){
  return new Promise(res => { try {
    const r = indexedDB.open('nathanael-voix', 2);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('v')) d.createObjectStore('v'); if (!d.objectStoreNames.contains('p')) d.createObjectStore('p'); };
    r.onsuccess = () => {
      db = r.result; let pending = 2; const fin = () => { if (--pending === 0) res(); };
      const load = (store, into) => { const q = db.transaction(store).objectStore(store).openCursor();
        q.onsuccess = e => { const c = e.target.result; if (c){ into[c.key] = c.value; c.continue(); } else fin(); }; q.onerror = fin; };
      load('v', recs); load('p', imgs);
    };
    r.onerror = () => res();
  } catch(e){ res(); } });
}
function putImg(k, d){ imgs[k] = d; try { db && db.transaction('p','readwrite').objectStore('p').put(d, k); } catch(e) {} }
function delImg(k){ delete imgs[k]; try { db && db.transaction('p','readwrite').objectStore('p').delete(k); } catch(e) {} }
function resizeImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const n = 480, c = document.createElement('canvas'); c.width = c.height = n;
      const m = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, n, n);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

function putRec(k, b){ recs[k] = b; delete urls[k]; try { db && db.transaction('v','readwrite').objectStore('v').put(b, k); } catch(e) {} }
function delRec(k){ delete recs[k]; delete urls[k]; try { db && db.transaction('v','readwrite').objectStore('v').delete(k); } catch(e) {} }
function playRec(k, cb){
  const b = recs[k]; if (!b) return false;
  stopVoice();
  let done = false; const fin = () => { if (done) return; done = true; cb && cb(); };
  try {
    const a = new Audio(urls[k] || (urls[k] = URL.createObjectURL(b)));
    clip = a; a.onended = fin; a.onerror = fin; setTimeout(fin, 12000);
    a.play().catch(fin);
  } catch(e){ return false; }
  return true;
}
function stopRec(){
  if (!recCur) return;
  clearTimeout(recCur.timer); const r = recCur; recCur = null;
  try { if (r.mr.state !== 'inactive') r.mr.stop(); } catch(e) {}
}
async function toggleRec(k){
  recMsg = '';
  if (recCur){ const same = recCur.key === k; stopRec(); if (same) return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ recMsg = 'Enregistrement indisponible sur ce navigateur.'; rerender(); return; }
  try {
    stopVoice();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream), chunks = [];
    recCur = {key:k, mr, timer:setTimeout(stopRec, 8000)};
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); if (chunks.length){ putRec(k, new Blob(chunks, {type: mr.mimeType || 'audio/webm'})); } rerender(); playRec(k); };
    mr.start(); rerender();
  } catch(e){ recCur = null; recMsg = 'Micro non autorisé : autorisez le micro pour cette page, puis réessayez.'; rerender(); }
}

}

/* ---------- Petits sons (générés, aucun fichier) ---------- */
let ac = null, noiseBuf = null;
function audio(){
  if (!S.sound) return null;
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
let audioUnlocked = false;
function unlockAudio(){
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e) {}
  const a = audio(); if (!a || audioUnlocked) return;
  try { const s = a.createBufferSource(); s.buffer = a.createBuffer(1, 1, 22050); s.connect(a.destination); s.start(0); audioUnlocked = a.state === 'running'; } catch(e) {}
}
document.addEventListener('pointerdown', unlockAudio, true);
function tone(f1, f2, t0, dur, type, vol){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur*0.8);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function pop(){ const a = audio(); if (a) tone(480, 920, a.currentTime, 0.14, 'sine', 0.22); }
function chime(long){
  const a = audio(); if (!a) return;
  const notes = long ? [523,659,784,1047,1319] : [659,784,1047];
  notes.forEach((f,i) => tone(f, 0, a.currentTime + i*0.09, 0.45, 'triangle', 0.16));
}
function applause(){
  const a = audio(); if (!a) return;
  if (!noiseBuf){
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
  }
  const now = a.currentTime + 0.05;
  for (let i=0;i<30;i++){
    const t = now + Math.random()*1.3, src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = 1100 + Math.random()*1600; bp.Q.value = 1.2;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12 + Math.random()*0.18, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    src.connect(bp).connect(g).connect(a.destination); src.start(t, Math.random()*0.8, 0.09);
  }
}

/* ---------- Confettis ---------- */
const fx = $('#fx'), g2 = fx.getContext('2d');
let parts = [], fxRunning = false;
const CONFETTI = ['#FF5C5C','#FFC83D','#4D7CFF','#5CC46A','#FF7AA2','#9B7BFF','#2EC4B6','#FF9F45'];
function sizeFx(){ const r = window.devicePixelRatio || 1; fx.width = innerWidth*r; fx.height = innerHeight*r; g2.setTransform(r,0,0,r,0,0); }
sizeFx(); addEventListener('resize', sizeFx);
function burst(x, y, n, power){
  if (reduceMotion) n = Math.min(n, 8);
  for (let i=0;i<n;i++){
    parts.push({x, y, vx:(Math.random()-.5)*10*power, vy:(-Math.random()*10-3)*power, life:70+Math.random()*50,
      c:pick(CONFETTI), s:7+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*0.3, star:Math.random()<.35});
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(stepFx); }
}
function drawStar(x, y, s){
  g2.beginPath();
  for (let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? s*.45 : s; g2.lineTo(x + rr*Math.cos(a), y + rr*Math.sin(a)); }
  g2.closePath(); g2.fill();
}
function stepFx(){
  g2.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  for (const p of parts){
    p.vy += 0.3; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    g2.globalAlpha = Math.min(1, p.life/30); g2.fillStyle = p.c;
    if (p.star) drawStar(p.x, p.y, p.s*0.8);
    else { g2.save(); g2.translate(p.x, p.y); g2.rotate(p.r); g2.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); g2.restore(); }
  }
  g2.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(stepFx); else { fxRunning = false; g2.clearRect(0,0,innerWidth,innerHeight); }
}
function celebrate(el){
  const r = el ? el.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0, height:0};
  burst(r.left + r.width/2, r.top + r.height/2, 40, 1.1);
  [0.2, 0.5, 0.8].forEach((f,i) => setTimeout(() => burst(innerWidth*f, innerHeight*0.25, 22, 0.9), 120*i));
}

function visual(cat, item, inPlay){
  switch (cat.kind){
    case 'color':
      return `<div class="blob${item.w === 'blanc' ? ' white' : ''}" style="--c:${item.c}"><span class="mini">${item.e}</span></div>`;
    case 'shape':
      return `<div class="shape">${shapeSVG(item)}</div>`;
    case 'number': {
      if (item.digitOnly) return `<b class="digitonly" style="color:${DIGIT_COLORS[item.n-1]}">${item.n}</b>`;
      const o = item.o, dots = Array.from({length:item.n}, () => `<span>${o.e}</span>`).join('');
      const cls = 'num' + (inPlay ? ' only' : '') + (inPlay && item.n <= 3 ? ' few' : '');
      return `<div class="${cls}">${inPlay ? '' : `<b class="digit" style="color:${DIGIT_COLORS[item.n-1]}">${item.n}</b>`}<div class="dots">${dots}</div></div>`;
    }
    case 'word': {
      const letters = [...item.w].map((ch,i) => `<span style="color:${LETTER_COLORS[i % LETTER_COLORS.length]}">${ch}</span>`).join('');
      return `<div class="wordv">${emoOf(item)}<span class="word">${letters}</span></div>`;
    }
    default:
      return emoOf(item);
  }
}

function bigQ(item){ return (item.a === 'les ' ? 'Où sont ' : 'Où est ') + item.a + (item.sp || item.w) + ' ?'; }

function drawName(){
  const nm = state.nm, box = $('#choices'), ch = nm.L[nm.i];
  box.classList.add('namegame');
  const slots = `<div class="slots" aria-label="${NAME}">${nm.L.map((c,j) => `<span class="slot2${j < nm.i ? ' full' : ''}${j === nm.i ? ' cur' : ''}" style="color:${LETTER_COLORS[j%6]}">${j < nm.i ? c.toUpperCase() : ''}</span>`).join('')}</div>`;
  if (ch === undefined){ box.innerHTML = slots; return; }
  const pool = shuffle([...'abcdefghijklmnopqrstuvwxyz'].filter(x => x !== ch && !(ch === 'ë' && x === 'e')));
  nm.opts = shuffle([ch].concat(pool.slice(0, Math.max(1, S.choices - 1))));
  box.innerHTML = slots + `<div class="nopts">${nm.opts.map((c,k) => `<button class="toy nopt" data-k="${k}" aria-label="${c}" style="color:${LETTER_COLORS[(k+nm.i)%6]}">${c.toUpperCase()}</button>`).join('')}</div>`;
}
function askLetter(){ const c = state.nm.L[state.nm.i]; state.question = 'Cherche la lettre ' + (LETTER_SAY[c] || c) + ' !'; return state.question; }
function nameRound(first){
  const round = ++state.round;
  state.nm = {i:0, m:0, locked:false, L:[...NAME.toLowerCase()], opts:[]};
  drawName(); const q = askLetter();
  const s = stat('prenom'); s.rounds++; touchDay(s); save();
  setTimeout(() => { if (round === state.round) seq([[(first ? 'On joue ! ' : '') + 'Écris ton prénom !'], [q]]); }, first ? 150 : 250);
}
$('#choices').addEventListener('click', e => {
  const b = e.target.closest('.nopt'), nm = state.nm;
  if (!b || !nm || nm.locked || !state.cat || state.cat.kind !== 'name') return;
  const ch = nm.opts[+b.dataset.k], want = nm.L[nm.i], s = stat('prenom'), round = state.round;
  s.tries++;
  if (ch === want){
    pop(); s.ok++; s.seen[want] = 1; if (!nm.m) s.first++; nm.m = 0; nm.i++; save();
    const r = b.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 14, .6);
    drawName();
    if (nm.i < nm.L.length){ seq([[LETTER_SAY[want] || want, 'w:' + want], 250, [askLetter()]]); return; }
    nm.locked = true; celebrate(null);
    state.streak = Math.min(STARS_PER_STICKER, state.streak + 1); renderStars(state.streak - 1);
    let spoken = false, timed = false;
    const go = () => {
      if (!spoken || !timed || round !== state.round) return;
      if (state.streak >= STARS_PER_STICKER){ state.streak = 0; giveSticker(() => { renderStars(); nameRound(); }); } else nameRound();
    };
    setTimeout(() => { timed = true; go(); }, 2500);
    seq([[pick(PRAISE), 'praise'], () => { chime(false); applause(); }, 1100, [NAME + ' !', 'name'], ['Tu sais écrire ton prénom !']], () => { spoken = true; go(); });
  } else {
    nm.m++; replay(b, 'wiggle');
    if (nm.m >= 2){ const t = $('#choices').querySelector(`[data-k="${nm.opts.indexOf(want)}"]`); if (t) t.classList.add('hint'); }
    seq([[pick(RETRY), 'retry'], [state.question]]);

function newRound(first){
  if (state.cat.kind === 'name') return nameRound(first);
  $('#choices').classList.remove('namegame');
  const cat = state.cat, n = Math.min(S.choices, cat.kind === 'number' ? S.numMax : cat.items.length);
  const round = ++state.round;
  state.misses = 0; state.locked = false;
  let target, choices, question;
  if (cat.kind === 'number'){
    const max = S.numMax;
    let t; do { t = 1 + rand(max); } while (t === state.last && max > 1);
    let pool = []; for (let k=1;k<=max;k++) if (k !== t) pool.push(k);
    const far = pool.filter(k => Math.abs(k - t) >= 2);
    const nums = [t].concat(shuffle(far.length >= n - 1 ? far : pool).slice(0, n - 1));
    if (Math.random() < 0.35){
      choices = nums.map(k => ({n:k, digitOnly:true, w:NUMS[k]}));
      question = 'Où est le ' + NUMS[t] + ' ?';
    } else {
      const o = pick(COUNT_OBJS);
      choices = nums.map(k => ({n:k, o, w:NUMS[k]}));
      question = 'Trouve ' + numWord(t, o.f) + ' ' + (t === 1 ? o.s : o.p) + ' !';
    }
    target = choices[0]; state.last = t;
  } else {
    const miss = stat(cat.id).miss || {};
    const pool = cat.items.filter(it => it !== state.last).flatMap(it => miss[it.w] > 0 ? [it, it, it] : [it]);
    target = pick(pool);
    choices = [target].concat(shuffle(cat.items.filter(it => it !== target)).slice(0, n - 1));
    question = bigQ(target); state.last = target;
  }
  state.target = target; state.choices = shuffle(choices); state.question = question;
  const box = $('#choices');
  box.style.setProperty('--n', state.choices.length);
  box.innerHTML = state.choices.map((c,i) =>
    `<button class="toy card" data-i="${i}" aria-label="${c.w}">${visual(cat, c, true)}</button>`).join('');
  const s = stat(cat.id); s.rounds++; touchDay(s); save();
  setTimeout(() => { if (round === state.round) say((first ? 'On joue ! ' : '') + question); }, first ? 150 : 250);
}

$('#choices').addEventListener('click', e => {

  const cat = state.cat, choice = state.choices[+card.dataset.i], s = stat(cat.id);
  s.tries++;
  const right = cat.kind === 'number' ? choice.n === state.target.n : choice === state.target;
  if (right){
    state.locked = true; s.ok++; s.seen[choice.w] = 1;
    if (state.misses === 0){ s.first++; if (s.miss && s.miss[choice.w] > 0) s.miss[choice.w]--; }

      phrase += choice.digitOnly ? "C'est le " + NUMS[choice.n] + ' !' : cap(numWord(choice.n, choice.o.f)) + ' ' + (choice.n === 1 ? choice.o.s : choice.o.p) + ' !';
    } else phrase += itIs(choice);
    let spoken = false, timed = false;
    const go = () => {
      if (!spoken || !timed || round !== state.round) return;
      if (state.streak >= STARS_PER_STICKER){ state.streak = 0; giveSticker(() => { renderStars(); newRound(); }); }
      else newRound();
    };
    setTimeout(() => { timed = true; go(); }, 1700);
    seq([[pick(PRAISE), 'praise'], () => { chime(false); applause(); }, 1100, [phrase]], () => { spoken = true; go(); });
  } else {
    state.misses++;
    if (state.misses === 1){ const m = s.miss || (s.miss = {}); m[state.target.w] = (m[state.target.w] || 0) + 1; }
    save();
    replay(card, 'wiggle');

      const tc = $('#choices').querySelector(`[data-i="${idx}"]`); if (tc) tc.classList.add('hint');
    }
    seq([[pick(RETRY), 'retry'], [state.question]]);
  }
});

/* ---------- Mémoire (3 paires) ---------- */
let mem = {open:[], lock:false, found:0, k:3};
function flip(c, on){ c.querySelector('.back').hidden = on; c.querySelector('.face').hidden = !on; }
function newMemory(){
  const cat = state.cat, k = Math.min(3, cat.items.length), its = shuffle(cat.items).slice(0, k);
  mem = {open:[], lock:false, found:0, k};
  $('#mgrid').innerHTML = shuffle(its.concat(its)).map((it,i) =>
    `<button class="toy card" data-i="${i}" data-w="${it.w}" data-s="${sp(it)}" aria-label="carte"><span class="back emo">❓</span><span class="face" hidden>${visual(cat, it, false)}</span></button>`).join('');
  $('#mgrid').style.gridTemplateColumns = 'repeat(3,1fr)';
  say('Trouve les paires !');
}
$('#mgrid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c || mem.lock || mem.open.includes(c) || c.classList.contains('done')) return;
  pop(); flip(c, true); mem.open.push(c);
  if (mem.open.length < 2) return;
  const [a, b] = mem.open;
  if (a.dataset.w === b.dataset.w){
    a.classList.add('done'); b.classList.add('done'); mem.open = []; chime(false); celebrate(a);
    const s = stat(state.cat.id); s.seen[a.dataset.w] = 1; touchDay(s); save();
    if (++mem.found === mem.k) setTimeout(() => { celebrate(null); seq([['Bravo ' + NAME + ' !', 'praise'], () => applause(), 1300, ['Tu as tout trouvé !']], () => setTimeout(newMemory, 600)); }, 700);
    else say(cap(a.dataset.s) + ' !', null, 'w:' + a.dataset.w);
  } else {
    mem.lock = true; replay(b, 'wiggle');
    setTimeout(() => { flip(a, false); flip(b, false); mem.open = []; mem.lock = false; }, 1100);
  }
});

/* ---------- Autocollants ---------- */
let stickerDone = null, stickerReadyAt = 0;
function giveSticker(done){
  const missing = STICKERS.filter(s => !data.stickers.includes(s[0]));
  const st = pick(missing.length ? missing : STICKERS);
  if (!data.stickers.includes(st[0])) data.stickers.push(st[0]);
  save();
  $('#stkEmo').textContent = st[0];
  replay($('#stkEmo'), 'boing');
  $('#sticker').hidden = false;
  chime(true);
  celebrate(null); setTimeout(() => celebrate(null), 500);
  seq([['Bravo ' + NAME + ' ! Tu as gagné un autocollant !', 'sticker'], () => applause(), 900, [cap(st[1]) + ' !']]);
  stickerDone = done; stickerReadyAt = Date.now() + 1800;
}
function closeSticker(){
  if ($('#sticker').hidden || Date.now() < stickerReadyAt) return;
  pop(); $('#sticker').hidden = true;
  const d = stickerDone; stickerDone = null; d && d();
}
$('#sticker').addEventListener('click', closeSticker);

function openAlbum(){
  $('#albumHead').innerHTML = `📒 <span style="font-variant-numeric:tabular-nums">${data.stickers.length} / ${STICKERS.length}</span>`;
  $('#albumGrid').innerHTML = STICKERS.map((s,i) => {
    const own = data.stickers.includes(s[0]);
    return `<button class="toy slot${own ? '' : ' locked'}" data-i="${i}" aria-label="${own ? s[1] : 'à gagner'}"><span class="emo">${s[0]}</span></button>`;
  }).join('');
  show('album');
}
$('#albumGrid').addEventListener('click', e => {
  const b = e.target.closest('.slot'); if (!b) return;
  const s = STICKERS[+b.dataset.i];
  replay(b, 'boing'); pop();
  if (b.classList.contains('locked')) say('Pas encore ! Joue pour le gagner.');
  else { const r = b.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 12, .6); say(cap(s[1]) + ' !'); }
});

/* ---------- Espace parents (appui long) ---------- */
const lock = $('#lockBtn'); let holdTimer = 0;
const startHold = e => { e.preventDefault(); lock.classList.add('holding'); clearTimeout(holdTimer); holdTimer = setTimeout(() => { lock.classList.remove('holding'); openParents(); }, 2500); };
const endHold = () => { clearTimeout(holdTimer); lock.classList.remove('holding'); };
lock.addEventListener('pointerdown', startHold);
['pointerup','pointerleave','pointercancel'].forEach(ev => lock.addEventListener(ev, endHold));
lock.addEventListener('contextmenu', e => e.preventDefault());
lock.addEventListener('keydown', e => { if (e.key === 'Enter' && e.repeat === false) startHold(e); });
lock.addEventListener('keyup', endHold);

function fmtDate(iso){
  if (!iso) return '—';
  try { return new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', {day:'numeric', month:'long'}); } catch(e){ return iso; }
}
function openParents(){ stopVoice(); renderParents(); $('#parents').hidden = false; }
function closeParents(){ stopRec(); stopVoice(); $('#parents').hidden = true; t0 = Date.now(); renderHome(); }
function seg(id, value, opts){
  return `<div class="seg" role="group" id="${id}">` + opts.map(([v,l]) =>
    `<button type="button" data-set="${id}" data-v="${v}" class="${String(v) === String(value) ? 'on' : ''}">${l}</button>`).join('') + '</div>';
}
function renderParents(){
  let ok = 0, tries = 0, last = '';
  const rows = CATS.map(c => {
    const s = stat(c.id), seen = Object.keys(s.seen).length, total = c.items.length;
    ok += s.ok; tries += s.tries; if (s.last > last) last = s.last;
    const pct = Math.round(100 * seen / total);
    const weak = Object.keys(s.miss || {}).filter(k => s.miss[k] > 0);
    const playTxt = (s.ok ? `${s.ok} réussites, dont ${s.first} du premier coup` : 'pas encore joué') + (weak.length ? ` · à revoir : ${weak.join(', ')}` : '');
    return `<div class="prow">
      <div class="pic" style="background:${c.c}">${c.ic || `<span style="font-size:13px;font-weight:700;color:#FFFFFF">${c.txt}</span>`}</div>
      <div style="min-width:0"><b>${c.say.replace('Miam ! ','')}</b>
        <div class="meta">Découvert ${seen}/${total} · ${playTxt}</div>
        <div class="meter"><span style="width:${pct}%;background:${c.c}"></span></div></div>
      <input type="checkbox" class="switch" id="en-${c.id}" data-cat="${c.id}" ${S.enabled[c.id] ? 'checked' : ''} aria-label="Afficher ${c.say}">
    </div>`;
  }).join('');
  const voiceOpts = frVoices.length
    ? `<select id="voiceSel"><option value="">Automatique${voice ? ' (' + voice.name + ')' : ''}</option>` +
        frVoices.map(v => `<option value="${v.voiceURI.replace(/"/g,'&quot;')}" ${v.voiceURI === S.voiceURI ? 'selected' : ''}>${v.name} · ${v.lang}</option>`).join('') + '</select>'
    : `<span class="note">${synth ? 'Aucune voix française trouvée sur cet appareil : une voix en ligne est utilisée si Internet est disponible, sinon enregistrez la vôtre ci-dessous. Ajoutez-en une dans les réglages du système (Accessibilité › Contenu énoncé, ou Synthèse vocale).' : 'Ce navigateur ne propose pas de synthèse vocale.'}</span>`;
  $('#sheet').innerHTML = `
    <div class="top"><h2>Espace parents</h2><span class="spacer"></span><button class="closebtn" id="pClose" aria-label="Fermer">✕</button></div>
    <div class="sum">
      <span class="chip">⭐ ${ok} bonnes réponses</span>
      <span class="chip">🎯 ${tries ? Math.round(100*ok/tries) : 0} % de réussite</span>
      <span class="chip">📒 ${data.stickers.length}/${STICKERS.length} autocollants</span>
      <span class="chip">📅 Dernière activité : ${fmtDate(last)}</span>
    </div>
    <h3>Catégories et progrès</h3>
    <p class="note" style="margin:0">Désactivez une catégorie pour la cacher du menu de l’enfant.</p>
    ${rows}
    <h3>Réglages du jeu</h3>
    <div class="setrow"><label>Images proposées en mode Jouer</label>${seg('choices', S.choices, [[2,'2 images'],[3,'3 images']])}</div>
    <div class="setrow"><label>Chiffres en mode Jouer</label>${seg('numMax', S.numMax, [[5,'1 à 5'],[10,'1 à 10']])}</div>
    <div class="setrow"><label>Écriture des mots</label>${seg('caps', S.caps ? 1 : 0, [[1,'MAJUSCULES'],[0,'minuscules']])}</div>
    <div class="setrow"><label for="sound">Applaudissements et petits sons</label><input type="checkbox" class="switch" id="sound" ${S.sound ? 'checked' : ''}></div>
    <div class="setrow"><label>Minuteur de jeu</label>${seg('timer', S.timer, [[0,'Sans'],[10,'10 min'],[20,'20 min']])}</div>
    <h3>Voix</h3>
    <div class="setrow"><label for="rate">Vitesse</label>
      <span style="display:flex;align-items:center;gap:10px"><span class="note">lente</span><input type="range" id="rate" min="0.5" max="1.1" step="0.05" value="${S.rate}"><span class="note">normale</span>
      <button type="button" class="pbtn dark" id="testVoice">Écouter</button></span></div>
    <div class="setrow"><label for="voiceSel">Voix française</label>${voiceOpts}</div>
    ${recHTML()}
    <h3>Données</h3>
    <p class="note" style="margin:0 0 10px">Les progrès sont enregistrés uniquement dans ce navigateur, sur cet appareil.</p>
    <p style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px"><button type="button" class="pbtn" id="expBtn">Exporter les progrès</button>
    <label class="pbtn">Importer<input type="file" id="impFile" accept=".json" hidden></label></p>
    <button type="button" class="pbtn danger" id="resetBtn">Remettre les progrès à zéro</button>
  `;
}
let resetArmed = 0;
$('#sheet').addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'pClose'){ closeParents(); return; }
  if (t.dataset.delimg){ delImg(t.dataset.delimg); rerender(); return; }
  if (t.dataset.rec){ toggleRec(t.dataset.rec); return; }
  if (t.dataset.play){ playRec(t.dataset.play); return; }
  if (t.dataset.del){ delRec(t.dataset.del); rerender(); return; }
  if (t.dataset.set){
    const k = t.dataset.set, v = +t.dataset.v;
    S[k] = k === 'caps' ? !!v : v; save();
    t.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t));
    return;
  }
  if (t.id === 'expBtn'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'})); a.download = 'nathanael-progres.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); return; }
  if (t.id === 'testVoice'){ say('Bonjour ! Pomme ! Où est le rouge ? Bravo !'); return; }
  if (t.id === 'resetBtn'){
    if (!resetArmed){
      t.classList.add('armed'); t.textContent = 'Touchez encore pour confirmer';
      resetArmed = setTimeout(() => { resetArmed = 0; t.classList.remove('armed'); t.textContent = 'Remettre les progrès à zéro'; }, 4000);
    } else {
      clearTimeout(resetArmed); resetArmed = 0;
      data.stats = {}; data.stickers = []; save(); renderParents();
    }
  }
});
$('#sheet').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.cat){
    const on = Object.values(S.enabled).filter(Boolean).length;
    if (!t.checked && on <= 1){ t.checked = true; return; }
    S.enabled[t.dataset.cat] = t.checked; save(); return;
  }
  if (t.dataset.img && t.files && t.files[0]){ resizeImage(t.files[0]).then(d => { putImg(t.dataset.img, d); rerender(); }).catch(() => { recMsg = 'Image illisible.'; rerender(); }); return; }
  if (t.id === 'recCat'){ recCat = t.value; rerender(); return; }
  if (t.id === 'impFile' && t.files[0]){ t.files[0].text().then(x => { const j = JSON.parse(x); if (!j || typeof j !== 'object' || Array.isArray(j)) throw 0; ['settings','stats'].forEach(k => { if (j[k] && (typeof j[k] !== 'object' || Array.isArray(j[k]))) delete j[k]; }); if (!Array.isArray(j.stickers)) delete j.stickers; Object.assign(data, j); save(); location.reload(); }).catch(() => { t.value = ''; }); return; }
  if (t.id === 'sound'){ S.sound = t.checked; save(); return; }
  if (t.id === 'voiceSel'){ S.voiceURI = t.value; save(); loadVoices(); say('Bonjour ! Je suis Nathanaël.'); }
});
$('#sheet').addEventListener('input', e => { if (e.target.id === 'rate'){ S.rate = +e.target.value; save(); } });
$('#parents').addEventListener('click', e => { if (e.target.id === 'parents') closeParents(); });

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#parents').hidden) closeParents(); });

/* Évite le menu contextuel et le zoom par double toucher pendant le jeu */
document.addEventListener('contextmenu', e => { if (!e.target.closest('.sheet')) e.preventDefault(); });
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});

/* Écran allumé pendant le jeu ; voix coupée si l'appli passe en arrière-plan */
let wake = null;
async function keepAwake(){ try { if (navigator.wakeLock && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch(e) {} }
document.addEventListener('visibilitychange', () => { if (document.hidden) stopVoice(); else if (wake) keepAwake(); });

/* Minuteur : pause douce, reprise par appui long des parents */
let t0 = Date.now(), pausing = false, ph = 0;
setInterval(() => {
  if (!S.timer || pausing || document.hidden || !$('#splash').hidden) return;
  if (Date.now() - t0 > S.timer * 60000){ pausing = true; stopVoice(); $('#pause').hidden = false; say('C’est l’heure de la pause, ' + NAME + ' ! À bientôt !'); }
}, 5000);
$('#pause').addEventListener('pointerdown', () => { ph = setTimeout(() => { $('#pause').hidden = true; pausing = false; t0 = Date.now(); }, 3000); });
['pointerup','pointercancel','pointerleave'].forEach(v => $('#pause').addEventListener(v, () => clearTimeout(ph)));

openDB();
renderHome();
})();
</script>

</body></html>
